" class="label" text-anchor="start">U10: temperature island / keep away from power heat</text><text x="800" y="667" class="small" text-anchor="start">U9: 1.8 V logic + dedicated LED supply + level checks</text><text x="800" y="699" class="small" text-anchor="start">FPC: matched return paths; local decoupling; low-noise routing</text><text x="800" y="731" class="small" text-anchor="start">RF antenna: upper polymer bridge; copper / battery clearance TBD</text><text x="55" y="870" class="label" text-anchor="start">Layer plan</text><text x="55" y="907" class="sub" text-anchor="start">L1: components + signals   |   L2: continuous GND   |   L3: power + slow signals   |   L4: signals + GND</text><text x="55" y="947" class="small" text-anchor="start">Main 0.8 mm / sensor 0.6 mm are fabrication targets. Confirm stack-up, courtyards and impedance with board house.</text><text x="55" y="1008" class="note" text-anchor="start">No electrical pads were invented. Native KiCad files contain mechanical outlines, holes and drawing-layer envelopes only.</text></svg>